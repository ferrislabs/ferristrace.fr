{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ferristrace-docs.fullname" . }}
  labels:
    {{- include "ferristrace-docs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ferristrace-docs.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.gatewayNamespaceSelector | nindent 12 }}
      ports:
        - port: {{ .Values.containerPort }}
          protocol: TCP
{{- end }}
