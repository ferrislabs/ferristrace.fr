name: Changelog

on:
  repository_dispatch:
    types: [changelog-updated]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/sync-changelog.mjs
      - name: Commit the snapshot when it changed
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: sync CHANGELOG.md from the core repository"
          git push
