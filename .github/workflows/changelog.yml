# Keeps the snapshot of the core repository's CHANGELOG.md in sync.
#
# The site fetches the core file at build time, so a release is visible on the
# next build. This workflow commits the snapshot it falls back to, and the
# resulting push triggers the deploy.
#
# From the core repository, on release:
#   gh api repos/Comettrace/website/dispatches \
#     -f event_type=changelog-updated
name: Changelog

on:
  repository_dispatch:
    types: [changelog-updated]
  workflow_dispatch:
  schedule:
    # A weekly safety net, in case a dispatch is ever missed.
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/sync-changelog.mjs
      - name: Commit the snapshot when it changed
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: sync CHANGELOG.md from the core repository"
          git push
