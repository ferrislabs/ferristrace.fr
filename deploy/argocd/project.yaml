# The project both FerrisTrace sites live in. Scoped deliberately narrowly:
# this repository as the only source, the `ferristrace` namespace as the only
# destination, and just the resource kinds the manifests actually declare.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ferristrace
  namespace: argocd
spec:
  description: FerrisTrace public sites (website + docs)
  sourceRepos:
    - git@github.com:ferrislabs/ferristrace.fr.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: ferristrace
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ''
      kind: Service
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
