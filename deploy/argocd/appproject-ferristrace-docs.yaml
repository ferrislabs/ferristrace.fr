# What the docs Application may deploy, and where: this repository only,
# into the `ferristrace` namespace only.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ferristrace-docs
  namespace: argocd
spec:
  description: The FerrisTrace documentation site.
  sourceRepos:
    - https://github.com/Ferristrace/ferristrace.dev
  destinations:
    - namespace: ferristrace
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
