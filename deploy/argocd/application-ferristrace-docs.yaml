# GitOps for the documentation site. The docker-docs workflow commits the new
# image tag to charts/ferristrace-docs/values-production.yaml on every push to
# main, and ArgoCD syncs it. Apply this manifest once, by a human, after the
# first image has been built (the chart refuses an empty image.tag).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ferristrace-docs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ferristrace-docs
  source:
    repoURL: https://github.com/Ferristrace/ferristrace.dev
    targetRevision: main
    path: charts/ferristrace-docs
    helm:
      releaseName: ferristrace-docs
      valueFiles:
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ferristrace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
