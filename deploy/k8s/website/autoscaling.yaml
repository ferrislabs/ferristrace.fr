apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: website
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: website
  # Two is what this ran at before, and the floor worth keeping: it is what
  # lets a pod be replaced without the site going dark. Six is headroom,
  # not a measured need — nginx serving a few MB of static files will not
  # be the bottleneck before the node is.
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      # Slow down: a quiet minute is not a reason to shed capacity.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
# Keeps a drain or an eviction from taking the whole site with it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: website
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: website
