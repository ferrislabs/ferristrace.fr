apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  labels:
    app.kubernetes.io/name: docs
    app.kubernetes.io/part-of: ferristrace
spec:
  # No replicas here on purpose: the HPA in autoscaling.yaml owns the count.
  # Declaring one as well makes ArgoCD selfHeal revert whatever the HPA just
  # did; a field absent from the manifest is one ArgoCD leaves alone.
  selector:
    matchLabels:
      app.kubernetes.io/name: docs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docs
        app.kubernetes.io/part-of: ferristrace
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: nginx
          # Pinned by `kustomize edit set image` from the deploy workflow.
          image: ghcr.io/comettrace/docs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # nginx starts as root to chown its cache dirs and spawn its
              # workers as uid 101; with ALL dropped it exits at startup on
              # chown("/var/cache/nginx/client_temp", 101).
              add: ["CHOWN", "SETGID", "SETUID"]
